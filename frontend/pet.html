<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐱 猫咪档案 — Cat-AI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --primary: #FF7043;
      --primary-light: #FFAB91;
      --bg: #FAFAFA;
      --card: #FFFFFF;
      --text: #3E2723;
      --text-secondary: #795548;
      --border: #F5E6E0;
      --success: #66BB6A;
      --warning: #FFA726;
      --danger: #EF5350;
      --radius: 12px;
      --shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }
    .topbar {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      color: white;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: var(--shadow);
    }
    .topbar a.back {
      color: white;
      text-decoration: none;
      font-size: 14px;
      opacity: 0.9;
    }
    .topbar a.back:hover { opacity: 1; }
    .topbar .title { font-size: 18px; font-weight: 600; }
    .container { max-width: 1100px; margin: 0 auto; padding: 20px; }

    /* 档案头卡 */
    .hero {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
      display: flex;
      gap: 24px;
      align-items: center;
      flex-wrap: wrap;
    }
    .hero .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      background: linear-gradient(135deg, var(--primary-light), var(--primary));
      font-size: 56px;
      line-height: 120px;
      text-align: center;
      flex-shrink: 0;
    }
    .hero .info { flex: 1; min-width: 220px; }
    .hero h1 { font-size: 26px; margin-bottom: 6px; }
    .breed-tag {
      display: inline-block;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white;
      padding: 5px 16px;
      border-radius: 16px;
      font-size: 14px;
      font-weight: 500;
    }
    .hero .meta { margin-top: 10px; color: var(--text-secondary); font-size: 14px; }
    .hero .dates { font-size: 12px; color: #aaa; margin-top: 8px; }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 20px;
    }
    @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
    }
    .card-title {
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .upload-area {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 26px 16px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
      background: #FFF8F5;
    }
    .upload-area:hover { border-color: var(--primary); background: #FFF3E0; }
    .upload-area.dragover { border-color: var(--primary); background: #FFE8D6; }
    .upload-area .icon { font-size: 40px; margin-bottom: 8px; }
    .upload-area p { color: var(--text-secondary); font-size: 13px; }

    .preview { margin-top: 14px; text-align: center; }
    .preview img { max-width: 100%; max-height: 260px; border-radius: var(--radius); box-shadow: var(--shadow); }
    .hidden { display: none !important; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 22px;
      border: none;
      border-radius: 22px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: #E65100; }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-success { background: var(--success); color: white; }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-danger { background: var(--danger); color: white; }

    .detail-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin: 14px 0; }
    .detail-item { background: #FFF8F5; padding: 12px; border-radius: 8px; }
    .detail-item .label { font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
    .detail-item .value { font-size: 14px; font-weight: 500; white-space: pre-wrap; }

    .confidence-badge { display: inline-block; padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: 500; }
    .confidence-high { background: #E8F5E9; color: var(--success); }
    .confidence-medium { background: #FFF3E0; color: var(--warning); }
    .confidence-low { background: #FFEBEE; color: var(--danger); }

    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--text-secondary); }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      outline: none; border-color: var(--primary);
    }
    .form-group textarea { resize: vertical; min-height: 70px; }

    /* 知识搜索 */
    .search-row { display: flex; gap: 8px; margin-bottom: 12px; }
    .search-row input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 22px;
      font-size: 14px;
      font-family: inherit;
    }
    .search-row input:focus { outline: none; border-color: var(--primary); }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .chip {
      padding: 5px 14px;
      border-radius: 16px;
      font-size: 13px;
      cursor: pointer;
      background: #F5F5F5;
      border: none;
      transition: all 0.2s;
    }
    .chip:hover { background: var(--primary-light); color: white; }
    .search-result {
      background: #FFF8F5;
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 10px;
    }
    .search-result .doc-title { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
    .search-result .doc-content {
      font-size: 13px;
      color: var(--text-secondary);
      white-space: pre-wrap;
      max-height: 200px;
      overflow-y: auto;
    }
    .search-empty { text-align: center; color: #999; padding: 30px; font-size: 13px; }

    .section-divider { border-top: 1px solid var(--border); margin: 24px 0; }

    .model-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
    .model-row label { font-size: 13px; font-weight: 500; color: var(--text-secondary); }
    .model-row select {
      flex: 1; min-width: 160px; padding: 7px 12px;
      border: 1px solid var(--border); border-radius: 8px;
      font-size: 13px; font-family: inherit; background: #FFF8F5;
    }
    .model-used { font-size: 12px; color: #999; text-align: center; margin-top: 8px; }

    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 24px;
      border-radius: 24px;
      color: white;
      font-size: 14px;
      font-weight: 500;
      z-index: 1000;
      animation: slideUp 0.3s ease;
    }
    .toast.success { background: var(--success); }
    .toast.error { background: var(--danger); }
    @keyframes slideUp {
      from { opacity: 0; transform: translateX(-50%) translateY(20px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    .danger-zone { text-align: center; padding: 20px 0 8px; }

    /* 健康管理 Tabs */
    .health-tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .health-tab {
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 14px;
      cursor: pointer;
      background: #F5F5F5;
      border: none;
      transition: all 0.2s;
    }
    .health-tab.active { background: var(--primary); color: white; }
    .health-panel { display: none; }
    .health-panel.active { display: block; }

    .record-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #FFF8F5;
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 8px;
    }
    .record-item .rec-main { flex: 1; min-width: 0; }
    .record-item .rec-title { font-size: 14px; font-weight: 500; }
    .record-item .rec-sub { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
    .record-item .rec-del {
      border: none; background: none; cursor: pointer;
      color: #ccc; font-size: 16px; flex-shrink: 0;
    }
    .record-item .rec-del:hover { color: var(--danger); }

    .status-badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 500;
      flex-shrink: 0;
    }
    .status-completed { background: #E8F5E9; color: var(--success); }
    .status-pending { background: #E3F2FD; color: #42A5F5; }
    .status-overdue { background: #FFEBEE; color: var(--danger); }

    .add-form {
      background: #FDF6F2;
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 16px;
    }
    .add-form .row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
    .add-form .row > * { flex: 1; min-width: 120px; }
    .add-form input, .add-form select {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      font-family: inherit;
      background: white;
    }
    .add-form input:focus, .add-form select:focus { outline: none; border-color: var(--primary); }

    .weight-chart {
      width: 100%;
      background: #FFF8F5;
      border-radius: 8px;
      margin-bottom: 14px;
    }
    .empty-tip { text-align: center; color: #999; padding: 24px; font-size: 13px; }
  </style>
</head>
<body>
  <div class="topbar">
    <a class="back" href="index.html">← 返回首页</a>
    <span class="title">🐱 猫咪档案</span>
  </div>

  <div class="container">
    <!-- 档案头卡 -->
    <div class="hero" id="heroCard">
      <div class="avatar" id="heroAvatar">🐱</div>
      <div class="info">
        <h1 id="heroName">加载中…</h1>
        <span class="breed-tag" id="heroBreed"></span>
        <div class="meta" id="heroMeta"></div>
        <div class="dates" id="heroDates"></div>
      </div>
    </div>

    <div class="grid">
      <!-- 重新拍照识别 -->
      <div class="card">
        <div class="card-title">📷 重新拍照识别</div>

        <div class="model-row">
          <label for="modelSelect">识别模型</label>
          <select id="modelSelect"></select>
        </div>

        <div class="upload-area" id="uploadArea">
          <div class="icon">🖼️</div>
          <p>点击或拖拽上传新照片</p>
          <p style="font-size: 12px; margin-top: 6px;">上传后自动识别，新照片将更新为头像</p>
        </div>
        <input type="file" id="imageInput" accept="image/*" style="display:none">
        <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none">

        <div class="preview hidden" id="previewArea">
          <img id="previewImg" src="" alt="预览">
        </div>

        <div style="text-align: center; margin-top: 14px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
          <button class="btn btn-outline" id="cameraBtn" type="button">📸 拍照</button>
          <button class="btn btn-primary" id="identifyBtn" disabled>🔍 重新识别</button>
        </div>

        <!-- 识别结果 -->
        <div id="resultArea" class="hidden">
          <div class="section-divider"></div>
          <div style="text-align: center; margin-bottom: 10px;">
            <span class="breed-tag" id="resultBreed">-</span>
            <span class="confidence-badge" id="resultConfidence">-</span>
          </div>
          <div class="detail-grid">
            <div class="detail-item"><div class="label">毛色</div><div class="value" id="resultColor">-</div></div>
            <div class="detail-item"><div class="label">花纹</div><div class="value" id="resultPattern">-</div></div>
            <div class="detail-item"><div class="label">体型</div><div class="value" id="resultBody">-</div></div>
            <div class="detail-item"><div class="label">估算年龄</div><div class="value" id="resultAge">-</div></div>
          </div>
          <div class="detail-item">
            <div class="label">健康观察</div>
            <div class="value" id="resultHealth" style="font-weight: normal;">-</div>
          </div>
          <div class="detail-item" style="margin-top: 10px;">
            <div class="label">AI 描述</div>
            <div class="value" id="resultDesc" style="font-weight: normal;">-</div>
          </div>
          <div class="model-used" id="modelUsed"></div>
          <div style="text-align: center; margin-top: 14px;">
            <button class="btn btn-success" id="applyBtn">✅ 应用识别结果到档案</button>
          </div>
        </div>
      </div>

      <!-- AI 知识问答 -->
      <div class="card">
        <div class="card-title">🤖 AI 知识问答</div>
        <div style="font-size:12px;color:#795548;margin-bottom:10px;">
          输入问题，AI 将基于猫咪知识库直接为您解答
        </div>
        <div class="search-row">
          <input type="text" id="aiQuestion" placeholder="问点什么，比如：英短容易得什么病？">
          <button class="btn btn-primary" id="aiAskBtn">提问</button>
        </div>
        <div class="chips" id="aiChips">
          <button class="chip ai-chip" data-q="品种特征和性格怎么样">品种特征</button>
          <button class="chip ai-chip" data-q="常见健康问题">健康须知</button>
          <button class="chip ai-chip" data-q="饲养护理建议">饲养建议</button>
          <button class="chip ai-chip" data-q="疫苗驱虫安排">疫苗驱虫</button>
          <button class="chip ai-chip" data-q="饮食禁忌">饮食禁忌</button>
        </div>
        <div id="aiAnswer">
          <div class="search-empty">输入问题或点击上方快捷标签，AI 将为您解答养猫知识</div>
        </div>
      </div>
      <div class="card">
        <div class="card-title">🔍 知识库搜索</div>
        <div class="search-row">
          <input type="text" id="kbQuery" placeholder="搜索与TA相关的知识…">
          <button class="btn btn-primary" id="kbSearchBtn">搜索</button>
        </div>
        <div class="chips" id="kbChips">
          <button class="chip kb-chip" data-q="品种 特征 性格">品种特征</button>
          <button class="chip kb-chip" data-q="健康 疾病 就医">健康须知</button>
          <button class="chip kb-chip" data-q="饲养 护理 喂食">饲养建议</button>
          <button class="chip kb-chip" data-q="疫苗 驱虫 绝育">疫苗驱虫</button>
          <button class="chip kb-chip" data-q="饮食 禁忌 有毒">饮食禁忌</button>
        </div>
        <div id="kbResults">
          <div class="search-empty">输入关键词或点击上方快捷标签，搜索最相关的猫咪知识</div>
        </div>
      </div>
    </div>

    <!-- 档案信息编辑 -->
    <div class="card" style="margin-top: 20px;">
      <div class="card-title">✏️ 档案信息</div>
      <form id="editForm">
        <div class="detail-grid">
          <div class="form-group">
            <label>昵称 *</label>
            <input type="text" id="fName" required>
          </div>
          <div class="form-group">
            <label>品种</label>
            <input type="text" id="fBreed">
          </div>
          <div class="form-group">
            <label>性别</label>
            <select id="fGender">
              <option value="未知">未知</option>
              <option value="公">公 ♂</option>
              <option value="母">母 ♀</option>
            </select>
          </div>
          <div class="form-group">
            <label>体重 (kg)</label>
            <input type="number" id="fWeight" step="0.1" min="0">
          </div>
          <div class="form-group">
            <label>毛色</label>
            <input type="text" id="fColor">
          </div>
          <div class="form-group">
            <label>花纹</label>
            <input type="text" id="fPattern">
          </div>
          <div class="form-group">
            <label>估算年龄</label>
            <input type="text" id="fAge">
          </div>
          <div class="form-group">
            <label>出生日期</label>
            <input type="date" id="fBirthDate">
          </div>
          <div class="form-group">
            <label>是否绝育</label>
            <select id="fNeutered">
              <option value="false">未绝育</option>
              <option value="true">已绝育</option>
            </select>
          </div>
          <div class="form-group">
            <label>芯片号</label>
            <input type="text" id="fMicrochip" placeholder="选填">
          </div>
          <div class="form-group">
            <label>识别置信度</label>
            <input type="text" id="fConfidence">
          </div>
        </div>
        <div class="form-group">
          <label>健康状态</label>
          <textarea id="fHealth"></textarea>
        </div>
        <div class="form-group">
          <label>备注</label>
          <textarea id="fNotes"></textarea>
        </div>
        <div style="text-align: center;">
          <button type="submit" class="btn btn-success" id="saveBtn">💾 保存修改</button>
        </div>
      </form>

      <!-- 品种知识摘要 -->
      <div id="summaryArea" class="hidden">
        <div class="section-divider"></div>
        <div class="card-title">📚 品种知识摘要</div>
        <div class="detail-item">
          <div class="value" id="summaryContent" style="font-size: 13px; font-weight: normal; max-height: 280px; overflow-y: auto;"></div>
        </div>
      </div>
    </div>

    <!-- 健康管理：疫苗 / 驱虫 / 体重 / 医疗 -->
    <div class="card" style="margin-top: 20px;">
      <div class="card-title">💓 健康管理</div>

      <div class="health-tabs">
        <button class="health-tab active" data-tab="vaccines">💉 疫苗</button>
        <button class="health-tab" data-tab="deworming">💊 驱虫</button>
        <button class="health-tab" data-tab="weights">⚖️ 体重</button>
        <button class="health-tab" data-tab="medical">🩺 医疗</button>
      </div>

      <!-- 疫苗 -->
      <div class="health-panel active" id="panel-vaccines">
        <div class="add-form">
          <div class="row">
            <select id="vName">
              <option value="猫三联">猫三联</option>
              <option value="狂犬疫苗">狂犬疫苗</option>
              <option value="猫白血病">猫白血病</option>
              <option value="其他">其他</option>
            </select>
            <input type="text" id="vNote" placeholder="针次/备注，如：第1针">
          </div>
          <div class="row">
            <input type="date" id="vDue" title="应接种日期">
            <input type="date" id="vDone" title="实际接种日期（留空=未接种）">
            <button class="btn btn-primary" id="vAdd" type="button">＋ 添加疫苗</button>
          </div>
        </div>
        <div id="list-vaccines"></div>
      </div>

      <!-- 驱虫 -->
      <div class="health-panel" id="panel-deworming">
        <div class="add-form">
          <div class="row">
            <select id="dType">
              <option value="体内驱虫">体内驱虫</option>
              <option value="体外驱虫">体外驱虫</option>
              <option value="体内外同驱">体内外同驱</option>
            </select>
            <input type="text" id="dProduct" placeholder="药品名，如：大宠爱">
          </div>
          <div class="row">
            <input type="date" id="dDate" title="驱虫日期">
            <input type="date" id="dNext" title="下次驱虫日期">
            <button class="btn btn-primary" id="dAdd" type="button">＋ 添加驱虫</button>
          </div>
        </div>
        <div id="list-deworming"></div>
      </div>

      <!-- 体重 -->
      <div class="health-panel" id="panel-weights">
        <div class="add-form">
          <div class="row">
            <input type="date" id="wDate" title="称重日期">
            <input type="number" id="wWeight" step="0.1" min="0" placeholder="体重 (kg)">
            <input type="text" id="wNote" placeholder="备注（选填）">
            <button class="btn btn-primary" id="wAdd" type="button">＋ 记录体重</button>
          </div>
        </div>
        <svg class="weight-chart hidden" id="weightChart" viewBox="0 0 600 180" preserveAspectRatio="none"></svg>
        <div id="list-weights"></div>
      </div>

      <!-- 医疗 -->
      <div class="health-panel" id="panel-medical">
        <div class="add-form">
          <div class="row">
            <input type="date" id="mDate" title="就诊日期">
            <input type="text" id="mHospital" placeholder="医院">
            <input type="text" id="mDoctor" placeholder="医生（选填）">
          </div>
          <div class="row">
            <input type="text" id="mDiagnosis" placeholder="诊断结果">
            <input type="text" id="mNotes" placeholder="症状/处方/费用等备注">
            <button class="btn btn-primary" id="mAdd" type="button">＋ 添加就诊</button>
          </div>
        </div>
        <div id="list-medical"></div>
      </div>
    </div>

    <!-- 危险操作 -->
    <div class="danger-zone">
      <button class="btn btn-danger" id="deleteBtn">🗑️ 删除此档案</button>
    </div>
  </div>

  <script src="android.js"></script>
  <script src="pet.js"></script>
</body>
