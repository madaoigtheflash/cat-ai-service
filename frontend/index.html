<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐱 Cat-AI — 智能猫咪识别与登记</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --primary: #FF7043;
      --primary-light: #FFAB91;
      --bg: #FAFAFA;
      --card: #FFFFFF;
      --text: #3E2723;
      --text-secondary: #795548;
      --border: #F5E6E0;
      --success: #66BB6A;
      --warning: #FFA726;
      --danger: #EF5350;
      --info: #42A5F5;
      --radius: 12px;
      --shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }
    
    .header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      color: white;
      padding: 24px;
      text-align: center;
      box-shadow: var(--shadow);
    }
    .header h1 { font-size: 28px; margin-bottom: 4px; }
    .header p { opacity: 0.9; font-size: 14px; }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    
    @media (max-width: 768px) {
      .grid { grid-template-columns: 1fr; }
    }
    
    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
    }
    
    .card-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .upload-area {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
      background: #FFF8F5;
    }
    .upload-area:hover {
      border-color: var(--primary);
      background: #FFF3E0;
    }
    .upload-area.dragover {
      border-color: var(--primary);
      background: #FFE8D6;
    }
    .upload-area .icon { font-size: 48px; margin-bottom: 12px; }
    .upload-area p { color: var(--text-secondary); font-size: 14px; }
    
    #imageInput { display: none; }
    
    .preview {
      margin-top: 16px;
      text-align: center;
    }
    .preview img {
      max-width: 100%;
      max-height: 320px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 12px 24px;
      border: none;
      border-radius: 24px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary {
      background: var(--primary);
      color: white;
    }
    .btn-primary:hover { background: #E65100; transform: translateY(-1px); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .btn-success { background: var(--success); color: white; }
    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
    
    .result-section { margin-top: 20px; }
    .result-section.hidden { display: none; }
    
    .breed-tag {
      display: inline-block;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white;
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    
    .confidence-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 500;
    }
    .confidence-high { background: #E8F5E9; color: var(--success); }
    .confidence-medium { background: #FFF3E0; color: var(--warning); }
    .confidence-low { background: #FFEBEE; color: var(--danger); }
    
    .detail-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin: 16px 0;
    }
    .detail-item {
      background: #FFF8F5;
      padding: 12px;
      border-radius: 8px;
    }
    .detail-item .label {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }
    .detail-item .value {
      font-size: 15px;
      font-weight: 500;
    }
    
    .knowledge-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .knowledge-tab {
      padding: 6px 14px;
      border-radius: 16px;
      font-size: 13px;
      cursor: pointer;
      background: #F5F5F5;
      border: none;
      transition: all 0.2s;
    }
    .knowledge-tab.active {
      background: var(--primary);
      color: white;
    }
    
    .knowledge-content {
      background: #FFF8F5;
      padding: 16px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.8;
      max-height: 400px;
      overflow-y: auto;
      white-space: pre-wrap;
    }
    .knowledge-content.hidden { display: none; }
    
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 6px;
      color: var(--text-secondary);
    }
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.2s;
    }
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--primary);
    }
    .form-group textarea {
      resize: vertical;
      min-height: 80px;
    }
    
    .pet-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
      margin-top: 16px;
    }
    .pet-card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
      text-align: center;
      transition: transform 0.2s;
    }
    .pet-card:hover { transform: translateY(-2px); }
    .pet-card .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary-light), var(--primary));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      margin: 0 auto 12px;
    }
    .pet-card .name { font-size: 16px; font-weight: 600; }
    .pet-card .breed { font-size: 13px; color: var(--text-secondary); }
    .pet-card .meta { font-size: 12px; color: #999; margin-top: 8px; }
    
    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 24px;
      border-radius: 24px;
      color: white;
      font-size: 14px;
      font-weight: 500;
      z-index: 1000;
      animation: slideUp 0.3s ease;
    }
    .toast.success { background: var(--success); }
    .toast.error { background: var(--danger); }
    @keyframes slideUp {
      from { opacity: 0; transform: translateX(-50%) translateY(20px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
    
    .section-divider {
      border-top: 1px solid var(--border);
      margin: 32px 0;
    }

    /* 宠物详情弹窗 */
    .modal-mask {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 900;
      padding: 20px;
    }
    .modal-mask.hidden { display: none; }
    .modal {
      background: var(--card);
      border-radius: var(--radius);
      max-width: 560px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      padding: 24px;
      position: relative;
    }
    .modal-close {
      position: absolute;
      top: 12px;
      right: 16px;
      border: none;
      background: none;
      font-size: 20px;
      cursor: pointer;
      color: var(--text-secondary);
    }
    .modal-avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      margin: 0 auto 12px;
      background: linear-gradient(135deg, var(--primary-light), var(--primary));
      font-size: 44px;
      line-height: 96px;
      text-align: center;
    }
    .pet-card { cursor: pointer; }
    .pet-card .avatar img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }
    .btn-danger { background: var(--danger); color: white; }

    /* 模型选择 */
    .model-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .model-row label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      white-space: nowrap;
    }
    .model-row select {
      flex: 1;
      min-width: 180px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      background: #FFF8F5;
    }
    .model-row select:focus { outline: none; border-color: var(--primary); }
    .model-hint { font-size: 12px; color: var(--text-secondary); }
    .model-hint.warn { color: var(--warning); }
    .model-used {
      font-size: 12px;
      color: #999;
      text-align: center;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🐱 Cat-AI 智能猫咪管家</h1>
    <p>AI 识图 × 知识库 × 档案管理 — 上传照片，认识你的猫</p>
  </div>

  <div class="container">
    <!-- 主功能区 -->
    <div class="grid">
      <!-- 左侧：上传与识别 -->
      <div class="card">
        <div class="card-title">📷 AI 品种识别</div>

        <!-- 模型选择 -->
        <div class="model-row">
          <label for="modelSelect">识别模型</label>
          <select id="modelSelect"></select>
          <span class="model-hint" id="modelHint"></span>
        </div>

        <div class="upload-area" id="uploadArea">
          <div class="icon">🖼️</div>
          <p>点击或拖拽上传猫咪照片</p>
          <p style="font-size: 12px; margin-top: 8px;">支持 JPG、PNG 格式</p>
        </div>
        <input type="file" id="imageInput" accept="image/*">
        <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none">

        <div class="preview hidden" id="previewArea">
          <img id="previewImg" src="" alt="预览">
        </div>

        <div style="text-align: center; margin-top: 16px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
          <button class="btn btn-outline" id="cameraBtn" type="button">
            <span>📸 拍照识别</span>
          </button>
          <button class="btn btn-primary" id="identifyBtn" disabled>
            <span>🔍 开始识别</span>
          </button>
        </div>
        
        <!-- 识别结果 -->
        <div class="result-section hidden" id="resultArea">
          <div class="section-divider"></div>
          <div style="text-align: center;">
            <div class="breed-tag" id="breedName">-</div>
            <span class="confidence-badge" id="confidenceBadge">-</span>
          </div>
          
          <div class="detail-grid" id="detailGrid">
            <div class="detail-item">
              <div class="label">毛色</div>
              <div class="value" id="colorValue">-</div>
            </div>
            <div class="detail-item">
              <div class="label">花纹</div>
              <div class="value" id="patternValue">-</div>
            </div>
            <div class="detail-item">
              <div class="label">体型</div>
              <div class="value" id="bodyValue">-</div>
            </div>
            <div class="detail-item">
              <div class="label">估算年龄</div>
              <div class="value" id="ageValue">-</div>
            </div>
          </div>
          
          <div class="detail-item" style="margin-top: 12px;">
            <div class="label">健康观察</div>
            <div class="value" id="healthValue" style="font-size: 14px; font-weight: normal;">-</div>
          </div>
          
          <div class="detail-item" style="margin-top: 12px;">
            <div class="label">AI 详细描述</div>
            <div class="value" id="descValue" style="font-size: 14px; font-weight: normal; white-space: pre-wrap;">-</div>
          </div>

          <div class="model-used" id="modelUsed"></div>
        </div>
      </div>
      
      <!-- 右侧：知识库与登记 -->
      <div class="card">
        <div class="card-title">📚 品种知识</div>
        
        <div id="knowledgeArea" class="hidden">
          <div class="knowledge-tabs" id="knowledgeTabs">
            <button class="knowledge-tab active" data-tab="basic">基础信息</button>
            <button class="knowledge-tab" data-tab="health">健康须知</button>
            <button class="knowledge-tab" data-tab="care">饲养建议</button>
            <button class="knowledge-tab" data-tab="price">品相价格</button>
          </div>
          
          <div class="knowledge-content" id="tab-basic">点击识别后，品种知识将自动加载...</div>
          <div class="knowledge-content hidden" id="tab-health"></div>
          <div class="knowledge-content hidden" id="tab-care"></div>
          <div class="knowledge-content hidden" id="tab-price"></div>
        </div>
        
        <div id="knowledgePlaceholder" style="text-align: center; padding: 40px; color: var(--text-secondary);">
          📷 请先上传照片并识别品种<br>知识库内容将自动匹配展示
        </div>
        
        <!-- 登记表单 -->
        <div class="section-divider"></div>
        <div class="card-title">📝 登记建档</div>
        
        <form id="registerForm">
          <div class="detail-grid">
            <div class="form-group">
              <label>昵称 *</label>
              <input type="text" id="regName" placeholder="给猫咪起个名字" required>
            </div>
            <div class="form-group">
              <label>品种</label>
              <input type="text" id="regBreed" placeholder="自动填充" readonly>
            </div>
          </div>
          
          <div class="detail-grid">
            <div class="form-group">
              <label>性别</label>
              <select id="regGender">
                <option value="未知">未知</option>
                <option value="公">公 ♂</option>
                <option value="母">母 ♀</option>
              </select>
            </div>
            <div class="form-group">
              <label>体重 (kg)</label>
              <input type="number" id="regWeight" placeholder="0.0" step="0.1">
            </div>
          </div>
          
          <div class="form-group">
            <label>备注</label>
            <textarea id="regNotes" placeholder="记录一些特别的事情..."></textarea>
          </div>
          
          <div style="text-align: center;">
            <button type="submit" class="btn btn-success" id="registerBtn">
              <span>💾 确认登记</span>
            </button>
          </div>
        </form>
      </div>
    </div>
    
    <!-- 已登记宠物列表 -->
    <div class="section-divider"></div>
    <div class="card">
      <div class="card-title">🏠 我的猫咪 (<span id="petCount">0</span>)</div>
      <div class="pet-list" id="petList">
        <!-- 动态填充 -->
      </div>
    </div>
  </div>


  <script src="android.js"></script>
  <script src="app.js"></script>
</body>
</html>
